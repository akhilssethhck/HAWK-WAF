<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAWK WAF - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090909;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            padding: 35px;
            background: #111111;
            border: 1px solid #3a0000;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #ff2020;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: #888888;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #080808;
            border: 1px solid #333333;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #ff2020;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #b00000;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e00000;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            min-height: 20px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #888888;
            text-decoration: none;
        }

        .back:hover {
            color: #ffffff;
        }

        .security {
            margin-top: 25px;
            padding: 12px;
            background: #0b0b0b;
            border-left: 3px solid #ff2020;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        HAWK WAF
    </div>

    <div class="subtitle">
        Administrator Login
    </div>

<form id="loginForm" onsubmit="event.preventDefault(); login();">
        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Administrator username"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Administrator password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

    <a class="back" href="/">
        ← Back to WAF Dashboard
    </a>

    <div class="security">
        Authorized HAWK WAF administrators only.
        All administrative actions are logged.
    </div>

</div>

<script>

async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "";

    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (response.ok && data.success) {

            window.location.href =
                "/admin/panel";

            return;
        }

        message.textContent =
            data.error ||
            "Invalid username or password";

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to HAWK WAF.";

    }

}

</script>

</body>
</html>
